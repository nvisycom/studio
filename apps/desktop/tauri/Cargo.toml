# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-desktop"
description = "Nvisy"
version = "0.1.0"
rust-version = "1.97"
edition = "2021"
license = "Apache-2.0"
publish = false

authors = ["nvisy <contact@nvisy.com>"]
repository = "https://github.com/nvisycom/portal"
homepage = "https://github.com/nvisycom/portal"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Tauri
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = { version = "2" }
tauri-plugin-store = { version = "2" }
tauri-plugin-http = { version = "2" }
tauri-plugin-global-shortcut = { version = "2" }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-notification = { version = "2" }
# Auth: open the system browser for sign-in, then receive the token back via a
# `nvisy://auth/callback` deep link.
tauri-plugin-opener = { version = "2" }
tauri-plugin-deep-link = { version = "2" }

# OS keychain (macOS Keychain / Windows Credential Manager / Linux Secret
# Service) for the desktop session token. `apple-native`/`windows-native` use
# the platform stores directly; `sync-secret-service` is the Linux backend.
keyring = { version = "3", features = [
	"apple-native",
	"windows-native",
	"sync-secret-service",
] }

# Async runtime
tokio = { version = "1", features = ["sync"] }

# Filesystem watching
notify = { version = "8" }
notify-debouncer-full = { version = "0.5" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# URL parsing for the auth deep-link callback.
url = { version = "2" }
form_urlencoded = { version = "1" }

# Observability
log = { version = "0.4" }

[build-dependencies]
# Tauri
tauri-build = { version = "2.6.3", features = [] }

# Rasterization (for icons)
resvg = { version = "0.48", features = [] }
tiny-skia = { version = "0.12", features = [] }

# Error context in the build script
anyhow = { version = "1", features = [] }

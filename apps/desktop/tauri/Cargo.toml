# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-desktop"
description = "Nvisy Desktop"
version = "0.1.0"
rust-version = "1.97"
edition = "2021"
license = "Apache-2.0"
publish = false

authors = ["nvisy <contact@nvisy.com>"]
repository = "https://github.com/nvisycom/portal"
homepage = "https://github.com/nvisycom/portal"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Tauri
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = { version = "2" }
tauri-plugin-store = { version = "2" }
# Native HTTP: lets the frontend make API requests through the Rust process,
# bypassing the webview's CORS (the desktop origin isn't on the API allowlist).
tauri-plugin-http = { version = "2" }

# Serialization
serde = { version = "1", features = ["derive"] }

# Observability
log = { version = "0.4" }

[build-dependencies]
# Tauri
tauri-build = { version = "2.6.3", features = [] }

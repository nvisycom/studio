# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-desktop"
description = "Nvisy Desktop"
version = "0.1.0"
rust-version = "1.77.2"
edition = "2021"
license = "Apache-2.0"
publish = false

authors = ["nvisy <contact@nvisy.com>"]
repository = "https://github.com/nvisycom/portal"
homepage = "https://github.com/nvisycom/portal"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.3" }
tauri-plugin-log = { version = "2" }
log = { version = "0.4" }

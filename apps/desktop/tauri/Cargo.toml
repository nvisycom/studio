# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-desktop"
description = "Nvisy"
version = "0.1.0"
rust-version = "1.97"
edition = "2024"
license = "Apache-2.0"
publish = false

authors = ["nvisy <contact@nvisy.com>"]
repository = "https://github.com/nvisycom/portal"
homepage = "https://github.com/nvisycom/portal"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Internal
studio-elide = { workspace = true }
studio-sqlite = { workspace = true }

# Tauri
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = { version = "2" }
tauri-plugin-store = { version = "2" }
tauri-plugin-http = { version = "2" }
tauri-plugin-global-shortcut = { version = "2" }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-notification = { version = "2" }
tauri-plugin-opener = { version = "2" }
tauri-plugin-deep-link = { version = "2" }

# OS keychain
keyring = { version = "3", features = [
	"apple-native",
	"windows-native",
	"sync-secret-service",
	"crypto-rust",
] }

# Async runtime
tokio = { version = "1", features = ["sync"] }

# Filesystem watching
notify = { version = "8" }
notify-debouncer-full = { version = "0.7" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Content hashing for the local documents index (matches the server's SHA-256).
sha2 = { version = "0.10" }

# URL parsing for the auth deep-link callback.
url = { version = "2" }
form_urlencoded = { version = "1" }

# Observability
log = { version = "0.4" }

[build-dependencies]
# Tauri
tauri-build = { version = "2.6.3", features = [] }

# Rasterization (for icons)
resvg = { version = "0.48", features = [] }
tiny-skia = { version = "0.12", features = [] }

# Error context in the build script
anyhow = { version = "1", features = [] }

# On Windows/Linux the OS starts a NEW process for a `nvisy://` deep link; the
# single-instance plugin forwards its argv to the already-running instance so the
# token reaches the process that's waiting for it. macOS delivers it in-process
# via `on_open_url`, so this backend isn't needed there.
[target."cfg(any(target_os = \"windows\", target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Pin rust-ini on Linux (where tauri-plugin-deep-link uses it): 0.21.2 added a
# field to the public `ParseOption` struct, breaking the struct-literal
# construction in tauri-plugin-deep-link — a minor-version break on rust-ini's
# side. There is no upgrade out of it: the latest stable plugin (2.6.2) has the
# bug, and the only newer release (3.0.0-alpha) still constructs ParseOption the
# same way AND requires Tauri 3-alpha. So pin rust-ini to its last good release;
# `=0.21.1` is the last version before the breaking field. We don't use rust-ini
# directly — this only constrains the resolver, which otherwise re-picks 0.21.3
# in CI (it doesn't build with --locked). Remove once rust-ini/the plugin fix it.
[target."cfg(target_os = \"linux\")".dependencies]
rust-ini = "=0.21.1"

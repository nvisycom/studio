<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Nvisy tray icon — "the ellipsis, dissolving" (the Elide dots mark), monochrome
    template. Black shape on transparent: macOS treats it as a template image and
    tints it to the menu bar (light/dark). No tile, no glow — solid dots that stay
    razor-sharp at tray size; the dissolve is carried by opacity, not a blur.

    The mark fills the central ~400-wide band (≈11% margin each side) so it carries
    the same visual weight as neighboring menu-bar icons, which nearly fill their
    bounds. Three dots evenly across that band: centres 122 / 256 / 390 (span
    122→390 ≈ the 400-wide block's dot centres), radius 50, vertically centred.
    Dissolving left→right by opacity 1 / .6 / .22, matching the app-icon rhythm.
  -->
  <g fill="#000000">
    <circle cx="122" cy="256" r="50"/>
    <circle cx="256" cy="256" r="50" opacity="0.6"/>
    <circle cx="390" cy="256" r="50" opacity="0.22"/>
  </g>
</svg>

<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    The Elide dots app icon, SQUIRCLE variant — the same art as `app-icon.svg`,
    clipped to the Apple-style continuous-corner squircle (superellipse, radius
    22.37%, corner smoothing 0.6; the macOS / Linear shape). Used where nothing
    masks the corners itself: the README logo and the Windows/Linux icon set.
    macOS masks its own, so the `.icns` uses the full-bleed square `app-icon.svg`
    instead (a pre-rounded icon would double-round under the system mask).

    The squircle path is generated (figma-squircle, 1024 box) and inlined here so
    there is no build-time dependency.
  -->
  <defs>
    <!-- Ambient ground: cool charcoal, lit from a pool behind the first dot. -->
    <radialGradient id="ground" cx="0.32" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </radialGradient>
    <!-- Soft halo: a wide Gaussian blur over the whole tile. -->
    <filter id="halo" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <!-- Apple-style squircle clip. -->
    <clipPath id="squircle">
      <path d="M 657.48992 0 c 128.2906 0 192.4358 0 241.4363 24.9670 a 229.0688 229.0688 0 0 1 100.1067 100.1067 c 24.9670 49.0005 24.9670 113.1458 24.9670 241.4363 L 1024 657.48992 c 0 128.2906 0 192.4358 -24.9670 241.4363 a 229.0688 229.0688 0 0 1 -100.1067 100.1067 c -49.0005 24.9670 -113.1458 24.9670 -241.4363 24.9670 L 366.51008 1024 c -128.2906 0 -192.4358 0 -241.4363 -24.9670 a 229.0688 229.0688 0 0 1 -100.1067 -100.1067 c -24.9670 -49.0005 -24.9670 -113.1458 -24.9670 -241.4363 L 0 366.51008 c 0 -128.2906 0 -192.4358 24.9670 -241.4363 a 229.0688 229.0688 0 0 1 100.1067 -100.1067 c 49.0005 -24.9670 113.1458 -24.9670 241.4363 -24.9670 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="#1a1c20"/>
    <rect width="1024" height="1024" fill="url(#ground)"/>
    <!-- Dots r=66, centres 322/512/702, dissolving 1 / .6 / .22; blurred halo
         beneath, crisp dots above. -->
    <g fill="#f4f5f7" filter="url(#halo)" opacity="0.9">
      <circle cx="322" cy="512" r="66"/>
      <circle cx="512" cy="512" r="66" opacity="0.6"/>
      <circle cx="702" cy="512" r="66" opacity="0.22"/>
    </g>
    <g fill="#f4f5f7">
      <circle cx="322" cy="512" r="66"/>
      <circle cx="512" cy="512" r="66" opacity="0.6"/>
      <circle cx="702" cy="512" r="66" opacity="0.22"/>
    </g>
  </g>
</svg>

# Configuration for cargo-deny
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# The lint level for crates that have been yanked from their source registry
yanked = "deny"
# Flag unmaintained crates only when we depend on them directly. Tauri's Linux
# GUI stack pulls in many unmaintained transitive crates (the gtk-rs GTK3
# bindings, the rust-unic family, proc-macro-error) with no workspace-level fix
# until Tauri updates them upstream; "workspace" keeps the check meaningful
# without a large, rotting ignore list of transitive advisory IDs.
unmaintained = "workspace"
# A list of advisory IDs to ignore
ignore = [
    # quick-xml 0.37.5 XML-parsing DoS, reached only through `little_exif
    # 0.6.23` (an EXIF/XMP dependency of elide-image). `little_exif` pins
    # `^0.37`; the fix is in the semver-incompatible 0.41 and 0.6.23 is its
    # latest release, so there is no in-range update — unresolvable here until
    # upstream bumps (TechnikTobi/little_exif#104). 0194 is a reachable O(N^2)
    # on a crafted image's attributes; 0195 does not apply (an `NsReader` bug,
    # and `little_exif` uses the plain `Reader`). The mitigation is the host's:
    # bound document size before detection. The desktop app does take untrusted
    # uploads but already caps upload size (the files module's `DropLimit`).
    # Tracked upstream in elide-runtime; a deferral, not a dismissal.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
# Confidence threshold for detecting a license from a license text (higher = stricter)
confidence-threshold = 0.8
# Private licenses are not allowed
private = { ignore = false, registries = [] }
# Warn if an allowed license is not used in the dependency graph
unused-allowed-license = "warn"

# List of explicitly allowed licenses (single licenses only)
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
    # Weak (file-level) copyleft; pulled in transitively by GTK/WebKit bindings.
    # Using these crates as-is does not affect our source.
    "MPL-2.0",
    # Permissive data license on `webpki-roots` (the bundled TLS root
    # certificates), pulled in transitively by tauri-plugin-http -> reqwest.
    "CDLA-Permissive-2.0",
]

# For compound licenses, block only if they contain a denied license
exceptions = []

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "deny"
# The graph highlighting used when creating dotgraphs for crates with multiple versions
highlight = "all"

# List of crates that are allowed
allow = []

# List of crates to deny - focus on actual security/legal issues
deny = [
    # Prefer rustls over OpenSSL for security and licensing simplicity
    { name = "openssl-sys", version = "*" },
    { name = "openssl", version = "*" },
]

skip = []
skip-tree = []
# The first-party engine crates are consumed as path (workspace) and git
# dependencies, neither of which carries a version requirement; this allows
# their wildcard versions without weakening the check for registry crates.
allow-wildcard-paths = true

[sources]
# Lint level for a crate from a registry that is not in the allow list
unknown-registry = "deny"
# Lint level for a crate from a git repository that is not in the allow list
unknown-git = "deny"
# List of URLs for allowed crate registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The Elide runtime is consumed straight from its in-house GitHub repos until
# those crates publish to crates.io; `elide-pipeline`/`elide-provider` live in
# `elide-runtime`, and their lower-level `elide-*` crates in `elide`.
allow-git = [
    "https://github.com/nvisycom/elide-runtime",
    "https://github.com/nvisycom/elide",
]

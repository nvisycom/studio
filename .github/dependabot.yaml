version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Europe/Berlin"
      day: "friday"
      time: "18:00"
    open-pull-requests-limit: 5
    labels:
      - "chore"
    commit-message:
      prefix: "dependabot"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Europe/Berlin"
      day: "friday"
      time: "18:00"
    open-pull-requests-limit: 5
    labels:
      - "chore"
    commit-message:
      prefix: "dependabot"
      include: "scope"

name: Performance

on:
  push:
    branches:
      - "main"
    paths:
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/performance.yml"
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/performance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared dependencies
        run: |
          npm run build --workspace=@nvisy/config
          npm run build --workspace=@nvisy/shared

      - name: Build packages
        run: |
          npm run build --workspace=@nvisy/landing
          npm run generate --workspace=@nvisy/webapp

      - name: Start Landing preview server
        run: |
          npm run preview --workspace=@nvisy/landing &
          npx wait-on http://localhost:4321 --timeout 60000

      - name: Run Lighthouse CI (Landing)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4321
            http://localhost:4321/about
            http://localhost:4321/pricing
          uploadArtifacts: true
          artifactName: lighthouse-landing-${{ github.run_id }}
          temporaryPublicStorage: true

      - name: Stop Landing preview server
        run: pkill -f "preview.*landing" || true

      - name: Start Webapp preview server
        run: |
          npm run preview --workspace=@nvisy/webapp &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI (Webapp)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          artifactName: lighthouse-webapp-${{ github.run_id }}
          temporaryPublicStorage: true

name: Performance

on:
  push:
    branches:
      - "main"
    paths:
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/performance.yaml"
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/performance.yaml"
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared dependencies
        run: |
          npm run build --workspace=@nvisy/config
          npm run build --workspace=@nvisy/shared

      - name: Build packages
        run: |
          npm run build --workspace=@nvisy/landing
          npm run generate --workspace=@nvisy/webapp

      - name: Run Lighthouse CI (Landing)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4321
            http://localhost:4321/about
            http://localhost:4321/pricing
          startServerCommand: "npm run preview --workspace=@nvisy/landing"
          startServerReadyPattern: "localhost"
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Run Lighthouse CI (Webapp)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          startServerCommand: "npm run preview --workspace=@nvisy/webapp"
          startServerReadyPattern: "localhost"
          uploadArtifacts: true
          temporaryPublicStorage: true

name: Integration

on:
  push:
    branches:
      - "main"
    paths:
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration.yaml"
  pull_request:
    paths:
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration.yaml"
  workflow_dispatch:

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master

  integration:
    name: Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run ci --workspaces --if-present

      - name: Type check
        run: npm run test:types --workspaces --if-present

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Run integration tests
        run: npm run test --workspaces --if-present
        env:
          CI: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e --workspaces --if-present
        env:
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: packages/*/playwright-report/
          retention-days: 30
